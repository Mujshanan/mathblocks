name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile-bootstrap:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
      - name: Generate frontend dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to the pull request branch
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency lockfile is already current."
            exit 0
          fi
          git commit -m "build: add frontend dependency lockfile"
          git push origin "HEAD:${BRANCH}"

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend assets
        run: npm run build
      - name: Type-check frontend
        run: npm run typecheck
      - name: Test frontend
        run: npm test

  python:
    name: Python compatibility matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
      - name: Build frontend assets
        run: |
          npm install
          npm run build
      - name: Install Python package and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" build
      - name: Run Python tests
        run: pytest
      - name: Build wheel and source distribution
        run: python -m build
      - name: Smoke-test built wheel
        run: |
          python -m pip install --no-deps --target /tmp/mathblocks-wheel dist/*.whl
          PYTHONPATH=/tmp/mathblocks-wheel python -c "from pathlib import Path; import mathblocks; from mathblocks.widgets import MathBlocksWidget; p = Path(mathblocks.__file__).parent / 'static'; assert (p / 'index.js').is_file(); assert (p / 'frontend.css').is_file(); w = MathBlocksWidget(); assert 'render' in w._esm; print('wheel import and bundled assets: OK')"
