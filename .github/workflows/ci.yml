name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
      - name: Install frontend dependencies
        run: npm install
      - name: Capture generated npm lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
      - name: Build frontend assets
        run: npm run build
      - name: Type-check frontend
        run: npm run typecheck
      - name: Test frontend
        run: npm test

  python:
    name: Python compatibility matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12"
      - name: Build frontend assets
        run: |
          npm install
          npm run build
      - name: Install Python package and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" build
      - name: Run Python tests
        run: pytest
      - name: Build wheel and source distribution
        run: python -m build
      - name: Smoke-test built wheel
        run: |
          python -m pip install --no-deps --target /tmp/mathblocks-wheel dist/*.whl
          PYTHONPATH=/tmp/mathblocks-wheel python -c "from pathlib import Path; import mathblocks; from mathblocks.widgets import MathBlocksWidget; p = Path(mathblocks.__file__).parent / 'static'; assert (p / 'index.js').is_file(); assert (p / 'frontend.css').is_file(); w = MathBlocksWidget(); assert 'render' in w._esm; print('wheel import and bundled assets: OK')"
