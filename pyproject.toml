[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mathblocks"
version = "0.1.0.dev0"
description = "Reusable mathematical interface components for Python."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Mujtaba Shanan" }]
keywords = ["math", "widgets", "anywidget", "jupyter", "visualization"]
classifiers = ["Development Status :: 2 - Pre-Alpha", "Framework :: Jupyter", "Programming Language :: Python :: 3"]
dependencies = ["anywidget>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]
marimo = ["marimo>=0.10"]

[tool.hatch.build.targets.wheel]
packages = ["src/mathblocks"]

[tool.hatch.build.targets.wheel.force-include]
"src/mathblocks/static" = "mathblocks/static"

[tool.pytest.ini_options]
testpaths = ["tests/python", "tests/integration"]

[tool.ruff]
line-length = 100
target-version = "py311"
