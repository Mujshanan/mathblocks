[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mathblocks"
dynamic = ["version"]
description = "Reusable mathematical interface components for Python."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Mujtaba Shanan" }]
keywords = ["math", "widgets", "anywidget", "jupyter", "visualization"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Framework :: Jupyter",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["anywidget>=0.11,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "build>=1.2"]
marimo = ["marimo>=0.10"]

[project.urls]
Homepage = "https://github.com/Mujshanan/mathblocks"
Repository = "https://github.com/Mujshanan/mathblocks"
Issues = "https://github.com/Mujshanan/mathblocks/issues"

[tool.hatch.version]
path = "src/mathblocks/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mathblocks"]

[tool.hatch.build.targets.sdist.force-include]
"src/mathblocks/static" = "src/mathblocks/static"

[tool.pytest.ini_options]
testpaths = ["tests/python", "tests/integration"]

[tool.ruff]
line-length = 100
target-version = "py311"
